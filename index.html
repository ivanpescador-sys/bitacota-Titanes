<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titanes. Bitácora nutrición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EE;
    --panel:#FFFFFF;
    --panel-2:#EFECE4;
    --line:#D8D3C6;
    --text:#1B2420;
    --text-muted:#5E6B63;
    --accent:#2F66E0;
    --accent-soft:rgba(61,123,255,0.14);
    --accent2:#9A6A0B;
    --accent2-soft:rgba(240,180,41,0.14);
    --warn:#E4573D;
    --warn-soft:rgba(228,87,61,0.14);
    --radius:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num{
    font-family:'Big Shoulders Display',system-ui,sans-serif;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
  }
  button{font-family:inherit;}
  input,select,textarea{
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    width:100%;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  button.btn{
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
    font-weight:500;
    transition:border-color .15s ease, transform .05s ease;
  }
  button.btn:hover{border-color:var(--accent);}
  button.btn:active{transform:scale(0.98);}
  button.btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  button.btn-primary:hover{border-color:var(--accent); filter:brightness(1.08);}
  button.btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted);}
  button.btn-ghost:hover{color:var(--text); border-color:var(--line);}
  button.btn-danger{color:var(--warn); border-color:var(--line); background:transparent;}
  button.btn-danger:hover{border-color:var(--warn);}

  /* ---- shell ---- */
  #app{height:100%; display:flex; flex-direction:column;}
  header{
    padding:16px 18px 14px;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-shrink:0;
  }
  header .brand h1{font-size:22px;}
  header .brand p{margin:2px 0 0; font-size:12.5px; color:var(--text-muted);}
  #storageNote{font-size:11px; color:var(--text-muted); margin-top:2px;}

  main{flex:1; min-height:0; display:flex; overflow:hidden;}

  /* roster */
  #roster{
    width:100%;
    overflow-y:auto;
    border-right:1px solid var(--line);
    flex-shrink:0;
  }
  #rosterToolbar{padding:12px 14px; display:flex; gap:8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2;}
  #rosterToolbar input{flex:1;}
  .rosterEmpty{padding:32px 20px; color:var(--text-muted); font-size:13.5px; text-align:center;}
  :root{color-scheme:light;}
  .rosterRow{color:var(--text);}
  .rosterRow .name{color:var(--text);}
  svg text[fill="#F1EDE4"]{fill:var(--text);}
  svg text[fill="#92A196"]{fill:var(--text-muted);}
  svg path[fill="#1C2921"], svg ellipse[fill="#1C2921"], svg polyline[stroke="#1C2921"]{fill:#E3DED2;}
  .rosterRow{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line);
    cursor:pointer; text-align:left; width:100%; background:none; border-left:3px solid transparent;
  }
  .rosterRow:hover{background:var(--panel);}
  .rosterRow .rowDel{margin-left:8px; padding:6px 8px; font-size:15px; opacity:.7; cursor:pointer; flex:none; border-radius:6px;}
  .rosterRow .rowDel:hover{opacity:1; background:rgba(228,87,61,.18);}
  .rosterRow.active{background:var(--panel); border-left-color:var(--accent);}
  .rosterRow .avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Big Shoulders Display'; font-weight:700; font-size:14px; color:var(--text-muted);
  }
  .rosterRow .info{flex:1; min-width:0; display:flex; flex-direction:column;}
  .rosterRow .info .name{font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rosterRow .info .meta{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
  .tag{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    border:1px solid var(--line); color:var(--text-muted); white-space:nowrap;
  }
  .tag.bajar{color:var(--accent); border-color:var(--accent);}
  .tag.subir{color:var(--accent2); border-color:var(--accent2);}
  .tag.recomp{color:#5E6B63; border-color:var(--line);}

  /* detail */
  #detail{width:100%; overflow-y:auto; padding:18px 18px 60px;}
  .emptyState{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-muted); text-align:center; padding:40px 20px; gap:14px;
  }
  .emptyState p{max-width:280px; font-size:13.5px; margin:0;}

  .detailHead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:18px;}
  .detailHead h2{font-size:26px;}
  .backBtn{display:none;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .card h3{font-size:13px; text-transform:none; color:var(--text-muted); font-family:'Work Sans'; font-weight:600; margin-bottom:12px;}

  .warnBanner{
    background:var(--warn-soft); border:1px solid rgba(228,87,61,0.4); color:var(--warn);
    border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px;
  }

  .planGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
  .planCell{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px; text-align:left;}
  .planCell .num{font-size:26px; line-height:1;}
  .planCell .lbl{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
  .planCell.accent{border-color:var(--accent); background:var(--accent-soft);}
  .planCell.accent2{border-color:var(--accent2); background:var(--accent2-soft);}

  .macroBar{height:10px; border-radius:6px; overflow:hidden; display:flex; margin:6px 0 10px; background:var(--panel-2);}
  .macroBar span{height:100%;}
  .macroLegend{display:flex; gap:14px; font-size:12px; color:var(--text-muted); flex-wrap:wrap;}
  .macroLegend .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
  .goalBarTrack{position:relative; height:14px; border-radius:8px; background:var(--panel-2); margin:18px 0 8px;}
  .goalBarFill{position:absolute; top:0; left:0; height:100%; border-radius:8px; background:linear-gradient(90deg, var(--accent), var(--accent2)); transition:width .3s;}
  .goalBarMarker{position:absolute; top:-7px; width:2px; height:28px; background:var(--text);}
  .goalBarLabel{position:absolute; top:-26px; font-size:10.5px; color:var(--text-muted); white-space:nowrap; transform:translateX(-50%);}
  .goalBarEnds{display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-top:2px;}

  table.histTable{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.histTable th{text-align:left; color:var(--text-muted); font-weight:500; padding:6px 6px; border-bottom:1px solid var(--line); font-size:11.5px;}
  table.histTable td{padding:7px 6px; border-bottom:1px solid var(--line);}
  table.histTable tr:last-child td{border-bottom:none;}
  .delta{font-size:11px; margin-left:4px;}
  .delta.down{color:#6FCF97;}
  .delta.up{color:var(--accent2);}

  .medidaForm .row3, .medidaForm .row2{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px 12px;}
  .medidaForm .field{margin-bottom:4px; min-width:0;}
  .medidaForm .row3 > *, .medidaForm .row2 > *{min-width:0;}
  input,select,textarea{box-sizing:border-box;}
  .medidaForm input{min-width:0; max-width:100%;}
  .medidaForm label{white-space:normal; line-height:1.25; min-height:2.5em; display:flex; align-items:flex-end;}
  .medidaForm details.moreData{margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .medidaForm details.moreData summary{cursor:pointer; font-size:13px; color:var(--text-muted);}
  .medidaForm details.moreData[open] summary{margin-bottom:6px; color:var(--text);}
  .medidaForm{border-top:1px dashed var(--line); margin-top:12px; padding-top:12px;}
  .moreData{margin:12px 0; border:1px dashed var(--line); border-radius:8px; padding:8px 10px;}
  .moreData summary{cursor:pointer; font-size:12.5px; color:var(--text-muted); list-style:none;}
  .moreData summary::-webkit-details-marker{display:none;}
  .moreData[open] summary{color:var(--text); margin-bottom:2px;}

  .photoRow{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 4px;}
  .photoSlot{
    position:relative; aspect-ratio:3/4; border:1px dashed var(--line); border-radius:8px;
    background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; text-align:center;
  }
  .photoSlot:hover{border-color:var(--accent);}
  .photoSlot .plusLbl{font-size:10.5px; color:var(--text-muted); padding:0 4px; line-height:1.3;}
  .photoSlot img{display:none; width:100%; height:100%; object-fit:cover;}
  .photoSlot.hasPhoto .plusLbl{display:none;}
  .photoSlot.hasPhoto img{display:block;}
  .photoSlot input[type=file]{display:none;}
  .photoHint{font-size:11px; color:var(--text-muted); margin:2px 0 4px;}

  .photoTimeline{border-top:1px dashed var(--line); margin-top:14px; padding-top:12px;}
  .photoSession{margin-bottom:12px;}
  .photoThumbRow{display:flex; gap:8px; flex-wrap:wrap;}
  .photoThumb{width:60px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block;}

  .trendScroll{overflow-x:auto; margin:-2px -2px 4px;}
  .trendLegend{display:flex; flex-wrap:wrap; gap:14px 18px; font-size:12px; color:var(--text-muted); margin-top:8px;}
  .trendLegendItem{display:flex; align-items:center; gap:5px;}
  .trendLegendItem .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .trendLegendItem b{color:var(--text); font-weight:600;}
  .trendDelta{font-size:11px; color:var(--text-muted);}
  .trendDelta.good{color:#6FCF97;}
  .trendDelta.bad{color:var(--warn);}

  .bellBtn{
    width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text-muted); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; position:relative;
  }
  .bellBtn.on{color:var(--accent2); border-color:var(--accent2);}
  .bellBtn .dotAlert{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--warn); display:none;}
  .bellBtn.hasDue .dotAlert{display:block;}

  .dueBanner{
    margin:0 14px 4px; padding:10px 12px; border-radius:8px;
    background:var(--accent2-soft); border:1px solid rgba(240,180,41,0.4);
    font-size:12.5px; color:var(--text);
  }
  .dueBanner strong{font-family:'Big Shoulders Display'; font-weight:700; font-size:14.5px;}
  .dueChips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .dueChip{
    font-size:11.5px; padding:4px 9px; border-radius:20px; border:1px solid var(--accent2);
    color:var(--accent2); background:transparent; cursor:pointer;
  }
  .dueChip:hover{background:var(--accent2-soft);}
  .badgeDue{color:var(--accent2); font-weight:600;}

  .cardActions{display:flex; gap:8px; margin-top:6px;}
  .note{font-size:11.5px; color:var(--text-muted); margin-top:8px; line-height:1.5;}

  footer.disclaimer{
    border-top:1px solid var(--line); padding:12px 18px 18px; font-size:11px; color:var(--text-muted);
    line-height:1.5; flex-shrink:0;
  }

  @media (min-width:860px){
    #roster{width:300px; flex-shrink:0;}
    #detail{width:auto; flex:1;}
    .backBtn{display:none !important;}
  }
  @media (max-width:859.98px){
    main{position:relative;}
    #roster, #detail{
      position:absolute; inset:0; width:100%; border-right:none;
    }
    #roster.hideMobile, #detail.hideMobile{display:none;}
    .backBtn{display:inline-flex !important; align-items:center; gap:4px;}
  }

  @media print{
    body.printingPDF *{visibility:hidden !important;}
    body.printingPDF #reportePDF, body.printingPDF #reportePDF *{visibility:visible !important;}
    body.printingPDF #reportePDF{position:absolute;left:0;top:0;width:100%;margin:0;border:none;box-shadow:none;}
    html.printingPDF, body.printingPDF, body.printingPDF *{height:auto !important; max-height:none !important; overflow:visible !important;}
    body.printingPDF #reportePDF{height:auto !important;}
  }
  @media print{
    header, #roster, #rosterToolbar, footer.disclaimer, .backBtn, .cardActions, .medidaForm, .photoTimeline, #newBtn, .printHide{display:none !important;}
    body{background:#fff; color:#111;}
    #detail{position:static; width:100%; padding:0;}
    .card{border:1px solid #ccc; background:#fff; break-inside:avoid;}
    .planCell{background:#f4f4f4; border-color:#ccc;}
    svg text[fill="#F1EDE4"]{fill:#111 !important;}
    svg text[fill="#92A196"]{fill:#555 !important;}
    .printBrand{display:flex !important;}
  }
  .printBrand{display:none; align-items:center; gap:10px; margin:0 0 12px; font-weight:700; font-size:18px;}
</style>
</head>

<script>
(function(){
  "use strict";

  // Diagnóstico: muestra errores que antes fallaban en silencio
  window.addEventListener('error', function(e){ try{ showAlert('Error: ' + (e.message || 'desconocido') + ' (línea ' + (e.lineno||'?') + ')'); }catch(_){} });
  window.addEventListener('unhandledrejection', function(e){ try{ var r = e.reason; showAlert('Error al guardar: ' + ((r && (r.message || r.code)) || r || 'desconocido')); }catch(_){} });

  var state = {
    socias: {},          // id -> data
    selectedId: null,
    mode: 'new',          // 'view' | 'new'
    db: null,
    storageMode: null,    // 'db' | 'local'
    unsub: null,
    assets: null          // photo storage, independent of storageMode
  };

  var LOCAL_KEY = 'bitacora_nutricion_v1';

  // ---------- storage abstraction ----------
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state.socias)); }
    catch(e){ /* storage unavailable — data stays in memory for this session */ }
  }

  function uid(){
    return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  async function initStorage(){
    try{
      if(window.claude && window.claude.use){
        var db = await window.claude.use('db');
        if(db){
          state.db = db;
          state.storageMode = 'db';
          setStorageNote('Guardado automáticamente.');
          var col = db.collection('socias');
          state.unsub = col.onSnapshot(function(snap){
            var map = {};
            snap.docs.forEach(function(d){ map[d.id] = d.data(); });
            state.socias = map;
            renderRoster();
            if(state.selectedId && map[state.selectedId] && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.medidaForm'))) renderDetail();
            else if(state.selectedId && !map[state.selectedId]){ state.selectedId = null; showEmpty(); }
          }, function(err){
            fallbackLocal();
          });
          return;
        }
      }
    }catch(e){ /* fall through to local */ }
    fallbackLocal();
  }

  async function initAssets(){
    try{
      if(window.claude && window.claude.use){
        var assets = await window.claude.use('assets');
        if(assets){
          state.assets = assets;
          if(state.selectedId) renderDetail();
        }
      }
    }catch(e){ /* photos stay disabled for this view */ }
  }

  function fallbackLocal(){
    state.storageMode = 'local';
    state.socias = loadLocal();
    setStorageNote('Guardado en este dispositivo.');
    renderRoster();
  }

  function setStorageNote(msg){
    document.getElementById('storageNote').textContent = msg;
  }

  async function createSocia(data){
    data.createdAt = Date.now();
    data.medidas = data.medidas || [];
    if(state.storageMode === 'db'){
      var ref = await state.db.collection('socias').add(data);
      return ref.id;
    } else {
      var id = uid();
      state.socias[id] = data;
      saveLocal();
      renderRoster();
      return id;
    }
  }

  async function updateSocia(id, patch){
    if(state.storageMode === 'db'){
      await state.db.doc('socias/' + id).update(patch);
    } else {
      Object.assign(state.socias[id], patch);
      saveLocal();
      renderRoster();
    }
  }

  // ---------- dialogos propios (confirm/alert del navegador no funcionan en esta vista) ----------
  function dlgOpen(msg, buttons){
    return new Promise(function(resolve){
      var ov = document.getElementById('dlgOverlay');
      if(ov){
        var box0 = ov.querySelector('.dlgMsgs');
        var p0 = document.createElement('p'); p0.textContent = msg; box0.appendChild(p0);
        if(!buttons.cancel){ resolve(true); return; }
        ov.remove();
      }
      ov = document.createElement('div');
      ov.id = 'dlgOverlay';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
      var box = document.createElement('div');

  async function deleteSocia(id){
    if(state.storageMode === 'db'){
      await state.db.doc('socias/' + id).delete();
    } else {
      delete state.socias[id];
      saveLocal();

  // ---------- formulas ----------
  var ACTIVITY = {
    ligera: 1.4,
    base: 1.55,
    func5: 1.7,
    gym: 1.725,
    alta: 1.9
  };

  function computePlan(socia, medida){
    if(!medida) return null;
    var peso = medida.peso;
    var grasaPct = medida.grasa;
    var leanKg = peso * (1 - grasaPct/100);
    var bmrFormula = 370 + 21.6 * leanKg;
    var bmr = (medida.bmr && medida.bmr > 0) ? medida.bmr : bmrFormula;
    var bmrFuente = (medida.bmr && medida.bmr > 0) ? 'báscula' : 'fórmula';
    var factor = ACTIVITY[socia.actividad] || ACTIVITY.base;
    var tdee = bmr * factor;

    var kcal;
    if(socia.objetivo === 'bajar') kcal = tdee - 450;
    else if(socia.objetivo === 'subir') kcal = tdee + 350;
    else kcal = tdee - 100;

    var clamped = false;
    if(kcal < 1200){ kcal = 1200; clamped = true; }

    var proteinFactor = socia.proteinFactor || 2.0;
    var proteinG = peso * proteinFactor;
    var proteinKcal = proteinG * 4;

    var fatKcal = kcal * 0.25;
    var fatG = fatKcal / 9;

    var carbKcal = Math.max(kcal - proteinKcal - fatKcal, 0);
    var carbG = carbKcal / 4;

    return {
      leanKg: leanKg, bmr: bmr, bmrFuente: bmrFuente, tdee: tdee, kcal: kcal, clamped: clamped,
      proteinG: proteinG, proteinKcal: proteinKcal,
      fatG: fatG, fatKcal: fatKcal,
      carbG: carbG, carbKcal: carbKcal,
      creatinaG: 5
    };
  }

  function lastMedida(socia){
    if(!socia.medidas || !socia.medidas.length) return null;
    return socia.medidas[socia.medidas.length - 1];
  }

  function objetivoLabel(o){
    return o === 'bajar' ? 'Bajar peso' : o === 'subir' ? 'Subir peso' : 'Recomposición';
  }
  function objetivoTagClass(o){
    return o === 'bajar' ? 'bajar' : o === 'subir' ? 'subir' : 'recomp';
  }
  function fmt(n, d){ return n === undefined || n === null || isNaN(n) ? '—' : n.toFixed(d===undefined?0:d); }
  function fmtDate(ts){
    if(!ts) return '';
    var d = new Date(ts);
    return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
  }

  // ---------- avisos de medidas pendientes ----------
  var DUE_DAYS = 30;
  var NEW_GRACE_DAYS = 7;

  // ---------- pago mensual ----------
  function clampDay(year, monthIndex, day){
    var last = new Date(year, monthIndex+1, 0).getDate();
    return Math.min(day, last);
  }
  function nextPaymentDate(s){
    if(!s.diaPago) return null;
    var base = new Date(s.ultimoPago || s.createdAt || Date.now());
    var y = base.getFullYear(), mo = base.getMonth()+1; // un mes después de la base
    return new Date(y, mo, clampDay(y, mo, s.diaPago));
  }
  function paymentStatus(s){
    var due = nextPaymentDate(s);
    if(!due) return null;
    var days = Math.ceil((due - new Date()) / 86400000);
    return {due:due, daysLeft:days, overdue: days < 0};
  }
  function paymentBadgeHtml(s){
    var st = paymentStatus(s);
    if(!st) return '<span class="note">sin día de pago</span>';
    if(st.overdue) return '<span class="tag" style="color:var(--warn); border-color:var(--warn);">Vencido hace '+Math.abs(st.daysLeft)+' día'+(Math.abs(st.daysLeft)===1?'':'s')+' ⚠️</span>';
    if(st.daysLeft === 0) return '<span class="tag" style="color:var(--accent2); border-color:var(--accent2);">Vence hoy</span>';
    return '<span class="note">Vence en '+st.daysLeft+' día'+(st.daysLeft===1?'':'s')+'</span>';
  }
  function paymentDueIds(){
    return Object.keys(state.socias).filter(function(id){
      var st = paymentStatus(state.socias[id]);
      return st && st.daysLeft <= 3; // vencido, vence hoy, o vence en 3 días o menos
    });
  }
  function renderPagoBanner(){
    var el = document.getElementById('pagoBanner');
    if(!el) return;
    var dueIds = paymentDueIds();
    if(!dueIds.length){ el.innerHTML = ''; return; }
    var chips = dueIds.map(function(id){
      var s = state.socias[id];
      var st = paymentStatus(s);
      var label = st.overdue ? ' (vencido)' : (st.daysLeft===0 ? ' (hoy)' : ' ('+st.daysLeft+'d)');
      return '<button class="dueChip" data-id="'+id+'" style="border-color:var(--accent2);">' + escapeHtml(s.nombre || '') + label + '</button>';
    }).join('');
    el.innerHTML = '<div class="dueBanner" style="border-color:var(--accent2);"><strong>💳 ' + dueIds.length + '</strong> ' +
      (dueIds.length===1 ? 'pago por cobrar' : 'pagos por cobrar') +
      '<div class="dueChips">' + chips + '</div></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.dueChip'), function(btn){
      btn.addEventListener('click', function(){ selectSocia(btn.getAttribute('data-id')); });
    });
  }

  function dueInfo(s){
    var m = lastMedida(s);
    if(!m){
      var created = s.createdAt || 0;
      var daysSinceAdded = created ? Math.floor((Date.now()-created)/86400000) : 0;
      if(daysSinceAdded >= NEW_GRACE_DAYS) return {due:true, days:daysSinceAdded, reason:'sin primera medida'};
      return {due:false, days:null, reason:null};
    }
    var days = Math.floor((Date.now()-m.fecha)/86400000);
    return {due: days>=DUE_DAYS, days: days, reason: days>=DUE_DAYS ? 'toca actualizar medidas' : null};
  }

  function renderDueBanner(dueIds){
    var el = document.getElementById('dueBanner');
    if(!dueIds.length){ el.innerHTML = ''; return; }
    var chips = dueIds.map(function(id){
      return '<button class="dueChip" data-id="'+id+'">' + escapeHtml(state.socias[id].nombre || '') + '</button>';
    }).join('');
    el.innerHTML = '<div class="dueBanner"><strong>' + dueIds.length + '</strong> ' +
      (dueIds.length===1 ? 'socio necesita' : 'socios necesitan') + ' tomar medidas y actualizar su plan.' +
      '<div class="dueChips">' + chips + '</div></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.dueChip'), function(btn){
      btn.addEventListener('click', function(){ selectSocia(btn.getAttribute('data-id')); });
    });
  }

  var NOTIF_KEY = 'bitacora_notif_pref';
  var NOTIF_LAST_KEY = 'bitacora_notif_last';
  function notifPrefOn(){ try{ return localStorage.getItem(NOTIF_KEY) === 'on'; }catch(e){ return false; } }
  function setNotifPref(on){ try{ localStorage.setItem(NOTIF_KEY, on ? 'on' : 'off'); }catch(e){} }

  function updateBellState(dueCount){
    var btn = document.getElementById('bellBtn');
    if(!btn) return;
    var active = notifPrefOn() && ('Notification' in window) && Notification.permission === 'granted';
    btn.classList.toggle('on', active);
    btn.classList.toggle('hasDue', dueCount > 0);
  }

  function maybeFireDailyNotification(dueIds){
    var pagoIds = paymentDueIds();
    if(!dueIds.length && !pagoIds.length) return;
    if(!notifPrefOn()) return;
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    var today = todayStr(), last = null;
    try{ last = localStorage.getItem(NOTIF_LAST_KEY); }catch(e){}
    if(last === today) return;
    try{
      var parts = [];
      if(dueIds.length){
        var names = dueIds.map(function(id){ return state.socias[id].nombre; }).slice(0,5).join(', ');
        parts.push(dueIds.length + (dueIds.length===1?' socio necesita':' socios necesitan') + ' tomar medidas: ' + names + (dueIds.length>5?'…':''));
      }
      if(pagoIds.length){
        var pagoNames = pagoIds.map(function(id){ return state.socias[id].nombre; }).slice(0,5).join(', ');
        parts.push(pagoIds.length + (pagoIds.length===1?' pago por cobrar':' pagos por cobrar') + ': ' + pagoNames + (pagoIds.length>5?'…':''));
      }
      new Notification('Bitácora nutricional', { body: parts.join(' · ') });
      localStorage.setItem(NOTIF_LAST_KEY, today);
    }catch(e){}
  }

  // ---------- roster render ----------
  function renderRoster(){
    var list = document.getElementById('rosterList');
    var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    var allIds = Object.keys(state.socias);
    var dueIds = allIds.filter(function(id){ return dueInfo(state.socias[id]).due; });
    renderDueBanner(dueIds);
    renderPagoBanner();
    updateBellState(dueIds.length + paymentDueIds().length);
    maybeFireDailyNotification(dueIds);

    var ids = allIds.sort(function(a,b){
      var da = dueInfo(state.socias[a]).due, db = dueInfo(state.socias[b]).due;
      if(da !== db) return da ? -1 : 1;
      return (state.socias[a].nombre||'').localeCompare(state.socias[b].nombre||'');
    });
    if(q){
      var qd = q.replace(/^d[ií]a\s*/,'').trim();
      var soloDia = /^\d{1,2}$/.test(qd);
      ids = ids.filter(function(id){
        var s0 = state.socias[id];
        if((s0.nombre||'').toLowerCase().indexOf(q) > -1) return true;
        return soloDia && s0.diaPago != null && String(s0.diaPago) === String(parseInt(qd,10));
      });
    }

    if(!ids.length){
      list.innerHTML = '<div class="rosterEmpty">' + (q ? 'Sin resultados.' : 'Aún no hay socios registrados. Toca "+ Nuevo socio" para empezar.') + '</div>';
      return;
    }

    list.innerHTML = '';
    ids.forEach(function(id){
      var s = state.socias[id];
      var m = lastMedida(s);
      var due = dueInfo(s);
      var row = document.createElement('button');
      row.className = 'rosterRow' + (id === state.selectedId ? ' active' : '');
      var initials = (s.nombre || '?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
      var pagoSt = paymentStatus(s);
      var pagoTag = pagoSt && pagoSt.daysLeft <= 3 ? ('<span class="badgeDue" style="margin-left:4px;">💳 ' + (pagoSt.overdue ? 'vencido' : (pagoSt.daysLeft===0?'hoy':pagoSt.daysLeft+'d')) + '</span>') : '';
      var metaRight = due.due ? ('<span class="badgeDue">⏰ ' + due.reason + '</span>') : (m ? fmtDate(m.fecha) : 'sin medidas');
      row.innerHTML =
        '<span class="avatar">' + initials + '</span>' +
        '<span class="info">' +
          '<span class="name">' + escapeHtml(s.nombre || 'Sin nombre') + '</span>' +
          '<span class="meta">' + (s.horario ? escapeHtml(s.horario) + ' · ' : '') + metaRight + pagoTag + '</span>' +
          '<span style="display:block;margin-top:3px;"><span style="display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:700;background:' + (s.diaPago ? '#F5C518;color:#111;' : 'transparent;border:1px dashed #999;color:#888;font-weight:500;') + '">💳 ' + (s.diaPago ? 'Paga el día ' + escapeHtml(String(s.diaPago)) : 'Sin día de pago') + '</span></span>' +
          resumenLinea(s, m) +
        '</span>' +
        '<span class="tag ' + objetivoTagClass(s.objetivo) + '">' + objetivoLabel(s.objetivo) + '</span>' +
        '<span class="rowDel" role="button" aria-label="Eliminar socio" title="Eliminar">🗑</span>';
      row.querySelector('.rowDel').addEventListener('click', async function(ev){
        ev.stopPropagation();
        if(!(await confirmDialog('¿Eliminar a ' + (s.nombre || 'este socio') + ' y todo su historial? Esto no se puede deshacer.'))) return;
        try{
          await deleteSocia(id);
          if(state.selectedId === id){ state.selectedId = null; showEmpty(); mobileShowRoster(); }
        }catch(e){ showAlert('No se pudo eliminar.'); }
      });
      row.addEventListener('click', function(){ selectSocia(id); });
      list.appendChild(row);
    });
  }

  function resumenLinea(s, m){
    if(!m) return '';
    var ms = s.medidas || [], f = ms[0], t = fmt(m.peso,1) + ' kg' + (m.grasa!=null ? ' · ' + fmt(m.grasa,1) + '% grasa' : '');
    if(ms.length > 1 && f.peso != null){
      var d = m.peso - f.peso, bien = (s.objetivo==='bajar' && d<0) || (s.objetivo==='subir' && d>0);
      t += ' · <span style="color:' + (bien ? 'var(--accent2, #5CC8A1)' : 'inherit') + ';">' + (d>0?'+':'') + d.toFixed(1) + ' kg desde el inicio</span>';
    }
    return '<span class="meta">' + t + '</span>';
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- peso objetivo y tiempo estimado ----------
  var META_GRASA = {mujer:27, hombre:20};
  function calcPesoObjetivo(s, l, sexo, altura){
    if(!l || !l.peso) return {err:'Primero registra una medida con peso y % de grasa.'};
    if(!sexo) return {err:'Elige el sexo para calcular la meta de % de grasa.'};
    if(l.grasa == null) return {err:'La última medida no tiene % de grasa.'};
    var tf = META_GRASA[sexo], lean = l.peso * (1 - l.grasa/100);
    if(l.grasa <= tf) return {err:'Ya está en ' + l.grasa + '% de grasa, en o debajo de la meta de ' + tf + '%. Conviene recomposición (ganar músculo) más que bajar peso.'};
    var v = lean / (1 - tf/100);
    var ajuste = null;
    if(altura && altura > 100){ var minW = 20 * Math.pow(altura/100, 2); if(v < minW){ ajuste = {calc: Math.round(v*2)/2}; v = minW; } }
    return {v: Math.round(v*2)/2, tf: tf, lean: lean, ajuste: ajuste};
  }
  function weeksTxt(w){ return w < 9 ? Math.ceil(w) + ' semanas' : (w/4.345).toFixed(1) + ' meses'; }
  function buildGoalPlan(s){
    var ms = s.medidas || []; if(!ms.length) return '';
    var l = ms[ms.length-1], t = '<h3 style="margin:18px 0 6px;font-size:16px;">Meta y tiempo estimado</h3>';
    if(s.objetivo === 'recomp'){
      var tf = META_GRASA[s.sexo], gKg = l.peso * (l.grasa||0)/100;
      return t + '<p class="note">Recomposición: la meta no es bajar el peso sino <b>bajar grasa y conservar o subir músculo</b>. Con entrenamiento de fuerza, proteína de ' + (s.proteinFactor||2).toFixed(1) + ' g/kg y déficit pequeño o mantenimiento, lo razonable es ver cambios en ciclos de ~12 semanas: cintura y % de grasa bajan, el peso casi no se mueve.' +
        (tf && l.grasa ? ' Ahora: ' + l.grasa + '% de grasa (' + gKg.toFixed(1) + ' kg); meta de referencia ' + tf + '%.' : (tf ? '' : ' Elige el sexo en Datos generales para ver la meta de % de grasa.')) + ' Evalúa cada 4 semanas con cinta y báscula.</p>';
    }
    if(!s.pesoObjetivo) return t + '<p class="note">Define o calcula el peso objetivo en Datos generales para ver el tiempo estimado.</p>';
    var diff = l.peso - s.pesoObjetivo, up = diff < 0, d = Math.abs(diff);
    if(d < 0.3) return t + '<p class="note">Ya está en su peso objetivo.</p>';
    var r1 = up ? 0.005 : 0.01, r2 = up ? 0.0025 : 0.005;
    var w1 = d/(r1*l.peso), w2 = d/(r2*l.peso);
    function fechaIn(w){ return new Date(Date.now() + w*7*86400000).toLocaleDateString('es-MX',{month:'short',year:'numeric'}); }
    return t + '<p style="margin:4px 0;"><b>' + (up?'Subir ':'Bajar ') + fmt(d,1) + ' kg</b> (' + fmt(l.peso,1) + ' → ' + fmt(s.pesoObjetivo,1) + ' kg)</p>' +
      '<p style="margin:4px 0;">Tiempo estimado: <b>' + weeksTxt(w1) + ' a ' + weeksTxt(w2) + '</b> · aprox. ' + fechaIn(w1) + ' – ' + fechaIn(w2) + '</p>' +
      '<p class="note">Ritmo seguro: ' + (up ? '0.25–0.5%' : '0.5–1%') + ' del peso corporal por semana (' + fmt(l.peso*r2,2) + '–' + fmt(l.peso*r1,2) + ' kg/sem). ' +
      (up ? '' : 'Más lento = menos pérdida de músculo; es el rango usado en guías de composición corporal y deporte. ') + 'Es una estimación: cambia con la adherencia y se recalcula con cada medida.</p>';
  }

  // reduce la foto antes de subirla: máx. 1280 px de lado, JPEG calidad ~0.75 (≈150-350 KB)
  function comprimirFoto(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        try{
          var max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.75);
        }catch(e){ URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

               : '<div class="note" style="text-align:center;align-self:center;">Sin foto</div>';

  function pct(part, total){ return total ? Math.max(0, (part/total*100)).toFixed(1) : 0; }

  // ---------- gráfica de progreso hacia el objetivo (peso) ----------
  function buildGoalGauge(s){
    if(!s.pesoObjetivo || !s.medidas || !s.medidas.length) return '';
    var start = s.medidas[0].peso;
    var current = s.medidas[s.medidas.length-1].peso;
    var goal = s.pesoObjetivo;
    if(start == null || current == null) return '';
    var diffTotal = start - goal;
    var diffSoFar = start - current;
    var ratio = diffTotal !== 0 ? diffSoFar / diffTotal : 1;
    ratio = Math.max(0, Math.min(1, ratio));
    var remaining = Math.abs(current - goal);
    var reached = remaining < 0.3;
    var lo = Math.min(start, goal), hi = Math.max(start, goal);
    var span = hi - lo || 1;
    var curPos = Math.max(0, Math.min(100, ((current - lo) / span) * 100));

    var html = '<div class="goalGauge">' +
      '<p class="note" style="margin:0 0 2px;">Progreso hacia el objetivo de peso</p>' +
      '<div class="goalBarTrack">' +
        '<div class="goalBarFill" style="width:'+ratio*100+'%;"></div>' +
        '<div class="goalBarMarker" style="left:'+curPos+'%;"></div>' +
        '<div class="goalBarLabel" style="left:'+curPos+'%;">' + fmt(current,1) + 'kg</div>' +
      '</div>' +
      '<div class="goalBarEnds"><span>Inicio: ' + fmt(start,1) + 'kg</span><span>Meta: ' + fmt(goal,1) + 'kg</span></div>' +
      '<p class="note" style="margin-top:6px;">' +
        (reached ? '🎉 Meta alcanzada.' : (Math.round(ratio*100) + '% del camino recorrido · faltan ' + fmt(remaining,1) + ' kg para llegar a la meta.')) +
      '</p>' +
    '</div>';
    return html;
  }

  // ---------- siluetas corporales ----------
  var BODY_VB_W = 300, BODY_Y0 = 15, BODY_H = 300;
  function smoothPath(pts){
    var n = pts.length, d = '';
    function mid(a,b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
    var m0 = mid(pts[n-1], pts[0]);
    d = 'M' + m0[0].toFixed(1) + ',' + m0[1].toFixed(1);
    for(var i=0;i<n;i++){
      var c = pts[i], m = mid(pts[i], pts[(i+1)%n]);
      d += ' Q' + c[0].toFixed(1) + ',' + c[1].toFixed(1) + ' ' + m[0].toFixed(1) + ',' + m[1].toFixed(1);
    }
    return d + 'Z';
  }
  function bodyShape(h, rec, bmi, fill, stroke, dash, withArms){
    var k = BODY_H / h, cx = BODY_VB_W / 2;
    function Y(fr){ return BODY_Y0 + fr * BODY_H; }
    var f = Math.sqrt(Math.max(0.6, Math.min(1.8, bmi/22)));
    var base = {cuello:.21*h*f, pecho:.52*h*f, cintura:.45*h*Math.pow(f,1.4), cadera:.55*h*f, brazo:.17*h*f, muslo:.32*h*f, pantorrilla:.21*h*f};
    function val(key){ return (rec && rec[key]) ? rec[key] : base[key]; }
    var neckH = val('cuello')/Math.PI*k/2;
    var chestH = val('pecho')/2.7*k/2;
    var waistH = val('cintura')/2.7*k/2;
    var hipH = val('cadera')/2.7*k/2;
    var shH = chestH + 0.05*h*k/2;
    var armD = val('brazo')/Math.PI*k;
    var tD = val('muslo')/Math.PI*k, cD = val('pantorrilla')/Math.PI*k;
    var kD = tD*0.72, aD = cD*0.5;
    var legOff = Math.max(hipH - tD/2, tD/2 + 1);
    var sw = dash ? '1.5' : '1.2';
    var attr = ' fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"' + (dash ? ' stroke-dasharray="4 3"' : '') + ' stroke-linejoin="round"';
    var out = '';
    [-1, 1].forEach(function(sd){
      var cxl = cx + sd*legOff;
      out += '<path d="' + smoothPath([
        [cxl - tD/2, Y(.52)], [cxl - kD/2, Y(.72)], [cxl - cD/2, Y(.80)], [cxl - aD/2, Y(.95)],
        [cxl + aD/2, Y(.95)], [cxl + cD/2, Y(.80)], [cxl + kD/2, Y(.72)], [cxl + tD/2, Y(.52)]
      ]) + '"' + attr + '/>';
      out += '<ellipse cx="' + cxl.toFixed(1) + '" cy="' + Y(.975).toFixed(1) + '" rx="' + (aD*0.9+3).toFixed(1) + '" ry="3"' + attr + '/>';
      if(withArms){
        var ax0 = cx + sd*(shH - armD*0.3), ax1 = cx + sd*(shH + 3), ax2 = cx + sd*(shH + 5);
        out += '<polyline points="' + ax0.toFixed(1) + ',' + Y(.21).toFixed(1) + ' ' + ax1.toFixed(1) + ',' + Y(.36).toFixed(1) + ' ' + ax2.toFixed(1) + ',' + Y(.50).toFixed(1) + '" fill="none" stroke="' + stroke + '" stroke-width="' + (armD*0.9+2).toFixed(1) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<polyline points="' + ax0.toFixed(1) + ',' + Y(.21).toFixed(1) + ' ' + ax1.toFixed(1) + ',' + Y(.36).toFixed(1) + ' ' + ax2.toFixed(1) + ',' + Y(.50).toFixed(1) + '" fill="none" stroke="' + fill + '" stroke-width="' + (armD*0.9).toFixed(1) + '" stroke-linecap="round" stroke-linejoin="round"/>';
      }
    });
    var L = [[cx-neckH, Y(.14)], [cx-neckH*1.1, Y(.165)], [cx-shH, Y(.19)], [cx-chestH, Y(.27)], [cx-waistH, Y(.38)], [cx-hipH, Y(.50)], [cx-hipH*0.95, Y(.54)]];
    var R = L.slice().reverse().map(function(q){ return [2*cx - q[0], q[1]]; });
    out += '<path d="' + smoothPath(L.concat(R)) + '"' + attr + '/>';
    var hr = 0.045*BODY_H;
    out += '<ellipse cx="' + cx + '" cy="' + Y(.065).toFixed(1) + '" rx="' + hr.toFixed(1) + '" ry="' + (0.062*BODY_H).toFixed(1) + '"' + attr + '/>';
    return {svg: out, half:{cuello:neckH, pecho:chestH, cintura:waistH, cadera:hipH, brazo:shH + armD*0.4, muslo:legOff + tD/2, pantorrilla:legOff + cD/2}};
  }
  function buildBodyFigures(s){
    var meds = s.medidas || [];
    if(!meds.length) return '';
    var h = s.altura && s.altura > 100 ? s.altura : 165;
    var cx = BODY_VB_W / 2;
    var last = meds[meds.length-1], first = meds[0];
    function latest(key){ for(var i=meds.length-1;i>=0;i--){ if(meds[i][key]) return {v:meds[i][key], i:i}; } return null; }
    function firstOf(key){ for(var i=0;i<meds.length;i++){ if(meds[i][key]) return {v:meds[i][key], i:i}; } return null; }
    var html = '<h3 style="margin:18px 0 6px;font-size:16px;">Dónde se midió</h3>';

    // figura 1: mapa de medidas
    var gen = bodyShape(h, null, 22, '#1C2921', '#92A196', false, true);
    var marks = [
      ['cuello','Cuello',.15,1],['pecho','Pecho',.27,1],['cintura','Cintura',.38,1],['cadera','Cadera',.50,1],
      ['brazo','Brazo',.30,-1],['muslo','Muslo',.62,-1],['pantorrilla','Pantorrilla',.80,-1]
    ];
    var svg = '<svg viewBox="0 0 ' + BODY_VB_W + ' 330" width="100%" style="display:block;max-width:340px;margin:0 auto;" role="img" aria-label="Silueta con las medidas tomadas">' + gen.svg;
    var any = false;
    marks.forEach(function(m){
      var l = latest(m[0]); if(!l) return;
      any = true;
      var y = BODY_Y0 + m[2]*BODY_H, side = m[3];
      var x0 = cx + side*gen.half[m[0]], x1 = cx + side*84;
      var f0 = firstOf(m[0]);
      var d = (f0 && f0.i !== l.i) ? l.v - f0.v : null;
      svg += '<line x1="' + (cx - side*gen.half[m[0]]).toFixed(1) + '" x2="' + x0.toFixed(1) + '" y1="' + y + '" y2="' + y + '" stroke="#F0B429" stroke-width="1.2"/>' +
        '<line x1="' + x0.toFixed(1) + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="#F0B429" stroke-width="0.8" stroke-dasharray="2 2"/>' +
        '<circle cx="' + x0.toFixed(1) + '" cy="' + y + '" r="2.5" fill="#F0B429"/>' +
        '<text x="' + (x1 + side*3) + '" y="' + (y - 1) + '" text-anchor="' + (side>0?'start':'end') + '" font-size="8.5" fill="#92A196">' + m[1] + '</text>' +
        '<text x="' + (x1 + side*3) + '" y="' + (y + 9) + '" text-anchor="' + (side>0?'start':'end') + '" font-size="10" font-weight="600" fill="#F1EDE4">' + fmt(l.v,1) + ' cm' +
        (d != null ? '<tspan font-size="8" font-weight="400" fill="' + (d<0?'#5CC8A1':'#E4573D') + '"> ' + (d>0?'+':'') + d.toFixed(1) + '</tspan>' : '') + '</text>';
    });
    svg += '</svg>';
    if(any){
      html += svg + '<p class="note" style="text-align:center;">Última medida de cada zona; en verde/rojo el cambio desde la primera.</p>';
    } else {
      html += '<p class="note">Cuando registres medidas con cinta (cuello, pecho, cintura, cadera, brazo, muslo, pantorrilla), aparecerán aquí sobre la silueta.</p>';
    }

    return html;
  }

  function buildComposicionReport(m){
    if(!m || m.peso==null) return '';
    var tile = function(val, unit, lbl, dec){
      if(val==null || isNaN(val)) return '';
      return "<div class='planCell' style='padding:10px;'><div class='num' style='font-size:20px;'>" + fmt(val, dec) +
        "<span style='font-size:12px;color:var(--text-muted);margin-left:3px;'>" + unit + "</span></div><div class='lbl'>" + lbl + "</div></div>";
    };
    var tiles = [
      tile(m.grasa,'%','Grasa corporal',1),
      tile(m.musculo,'kg','Músculo esquelético',1),
      tile(m.visceral,'','Grasa visceral',0),
      tile(m.bmr,'kcal','Metabolismo basal',0),
      tile(m.agua,'%','Agua corporal',1),
      tile(m.hueso,'kg','Masa ósea',2),
      tile(m.proteinaPct,'%','Proteínas',1),
      tile(m.masaMuscular,'kg','Masa muscular',1)
    ].join('');
    var parts = [];
    if(m.agua!=null) parts.push({lbl:'Agua', kg:m.peso*m.agua/100, c:'#2F66E0'});
    if(m.proteinaPct!=null) parts.push({lbl:'Proteínas', kg:m.peso*m.proteinaPct/100, c:'#F0B429'});
    if(m.grasa!=null) parts.push({lbl:'Grasa', kg:m.peso*m.grasa/100, c:'#E4573D'});
    if(m.hueso!=null) parts.push({lbl:'Masa ósea', kg:m.hueso, c:'#6FCF97'});
    var total = parts.reduce(function(a,p){ return a + p.kg; }, 0);
    var donut = '', legend = '';
    if(parts.length && total > 0){
      var C = 2*Math.PI*60, acc = 0;
      donut = "<svg viewBox='0 0 160 160' width='160' height='160' role='img' aria-label='Composición corporal' style='flex:0 0 auto;'>";
      parts.forEach(function(p){
        var len = p.kg/total*C;
        donut += "<circle cx='80' cy='80' r='60' fill='none' stroke='" + p.c + "' stroke-width='22' stroke-dasharray='" +
          len.toFixed(2) + " " + (C-len).toFixed(2) + "' stroke-dashoffset='" + (-acc).toFixed(2) + "' transform='rotate(-90 80 80)'/>";
        acc += len;
      });
      donut += "<text x='80' y='78' text-anchor='middle' font-size='12' fill='var(--text-muted)'>Total</text>" +
        "<text x='80' y='98' text-anchor='middle' font-size='17' font-weight='700' fill='var(--text)'>" + fmt(total,1) + " kg</text></svg>";
      legend = parts.map(function(p){
        return "<div style='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);'>" +
          "<span><span style='display:inline-block;width:10px;height:10px;border-radius:50%;background:" + p.c + ";margin-right:8px;'></span>" + p.lbl + "</span>" +
          "<b>" + fmt(p.kg,2) + " kg</b></div>";
      }).join('');
    }
    return "<div class='card'><h3>Reporte de composición corporal · " + fmtDate(m.fecha) + "</h3>" +

  function buildReportePDF(s, sid){

    var color = score==null ? 'var(--text-muted)' : score >= 70 ? '#1E8E5A' : score >= 50 ? '#B7791F' : '#C0392B';

    var rows = REP_PARAMS.filter(function(p){ return fin[p.k] != null; }).map(function(p){
      var ini = base[p.k], cam = ini != null ? fin[p.k] - ini : null;
      var g = REP_GOOD[p.k] || 0;
      var c = (cam==null || cam===0 || g===0) ? 'var(--text-muted)' : ((cam*g) > 0 ? '#1E8E5A' : '#C0392B');
      var flecha = cam==null ? '' : (cam > 0 ? '▲ ' : cam < 0 ? '▼ ' : '• ');
      return "<tr><td style='padding:7px 6px;border-bottom:1px solid var(--line);'>" + p.l + "</td>" +
        "<td style='padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;'>" + (ini==null ? '—' : fmt(ini,p.d)) + "</td>" +
        "<td style='padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-weight:700;'>" + fmt(fin[p.k],p.d) + " " + p.u + "</td>" +
        "<td style='padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;color:" + c + ";font-weight:600;'>" +
          (cam==null ? '—' : flecha + (cam>0?'+':'') + fmt(cam,p.d)) + "</td></tr>";
    }).join('');

    var seriesKeys = Object.keys(REP_COLORS).filter(function(k){
      return ms.filter(function(m){ return m[k] != null && m[k] !== 0; }).length >= 2;
    });
    var chart = '', legend = '';
    if(seriesKeys.length){
      var W = 340, H = 220, padL = 14, padR = 14, padT = 14, padB = 28;
      var innerW = W - padL - padR, innerH = H - padT - padB, n = ms.length;
      var X = function(i){ return padL + (n>1 ? i/(n-1) : 0.5) * innerW; };
      var norm = {}, all = [100];
      seriesKeys.forEach(function(k){
        var b0 = ms.filter(function(m){ return m[k] != null && m[k] !== 0; })[0][k];
        norm[k] = ms.map(function(m){ return m[k] != null && m[k] !== 0 ? m[k]/b0*100 : null; });
        norm[k].forEach(function(v){ if(v!=null) all.push(v); });
      });
      var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
      if(hi - lo < 4){ lo -= 2; hi += 2; } else { var pd = (hi-lo)*0.1; lo -= pd; hi += pd; }
      var Y = function(v){ return padT + (1 - (v-lo)/(hi-lo)) * innerH; };
      chart = "<svg viewBox='0 0 " + W + " " + H + "' width='100%' role='img' aria-label='Gráfica combinada de parámetros' style='display:block;'>";
      chart += "<line x1='" + padL + "' x2='" + (W-padR) + "' y1='" + Y(100).toFixed(1) + "' y2='" + Y(100).toFixed(1) + "' stroke='#999' stroke-dasharray='3 3' stroke-width='1'/>";
      var iIni = ms.indexOf(del[0]);
      if(iIni > 0) chart += "<line x1='" + X(iIni).toFixed(1) + "' x2='" + X(iIni).toFixed(1) + "' y1='" + padT + "' y2='" + (H-padB) + "' stroke='var(--accent)' stroke-dasharray='4 3' stroke-width='1'/>" +
        "<text x='" + (X(iIni)+4).toFixed(1) + "' y='" + (padT+10) + "' font-size='9' fill='var(--accent)'>inicio del periodo</text>";
      seriesKeys.forEach(function(k){
        var pts = [];
        norm[k].forEach(function(v,i){ if(v!=null) pts.push(X(i).toFixed(1) + ',' + Y(v).toFixed(1)); });
        if(pts.length > 1) chart += "<polyline points='" + pts.join(' ') + "' fill='none' stroke='" + REP_COLORS[k] + "' stroke-width='2'/>";
        norm[k].forEach(function(v,i){ if(v!=null) chart += "<circle cx='" + X(i).toFixed(1) + "' cy='" + Y(v).toFixed(1) + "' r='2.6' fill='" + REP_COLORS[k] + "'/>"; });
      });
      chart += "<text x='" + padL + "' y='" + (H-8) + "' font-size='9' fill='var(--text-muted)'>" + fmtLargo(ms[0].fecha) + "</text>" +
        "<text x='" + (W-padR) + "' y='" + (H-8) + "' font-size='9' text-anchor='end' fill='var(--text-muted)'>" + fmtLargo(ms[n-1].fecha) + "</text>";
      chart += "</svg>";
      legend = seriesKeys.map(function(k){
        var p = REP_PARAMS.filter(function(x){ return x.k===k; })[0];
        var arr = norm[k].filter(function(v){ return v!=null; });
        var delta = arr[arr.length-1] - 100;
        return "<span style='display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0;font-size:11px;'><span style='width:10px;height:10px;border-radius:50%;background:" +
          REP_COLORS[k] + ";display:inline-block;'></span>" + p.l + " (" + (delta>=0?'+':'') + fmt(delta,1) + "%)</span>";
      }).join('');
    } else {
      chart = "<p class='note' style='margin:14px 0;'>La gráfica combinada aparecerá con dos o más mediciones.</p>";
    }

    var comp = comps.map(function(c){
      return "<div class='planCell' style='padding:8px;'><div class='num' style='font-size:18px;'>" + c.val + "<span style='font-size:11px;color:var(--text-muted);'>/100</span></div>" +
        "<div class='lbl'>" + c.label + "</div><div class='lbl' style='font-size:10px;'>" + c.detail + "</div></div>";
    }).join('');

    return "<div class='card' id='reportePDF' style='border:2px solid var(--text);'>" +
      "<div style='display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--text);padding-bottom:10px;'>" +
        "<div><div style='font-size:11px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;'>Titanes · Reporte de progreso</div>" +
        "<div style='font-size:22px;font-weight:800;margin-top:2px;'>" + s.nombre + "</div></div>" +
        "<div style='display:flex;align-items:center;gap:10px;'><div style='text-align:right;font-size:12px;color:var(--text-muted);'>" + rango + "</div>" +
        (logoSrc ? "<img src='" + logoSrc + "' alt='Titanes' style='width:58px;height:58px;object-fit:contain;flex:0 0 auto;'>" : '') + "</div></div>" +
      "<div style='display:flex;gap:14px;align-items:center;margin:14px 0;flex-wrap:wrap;'>" +
        "<div style='min-width:130px;text-align:center;border:2px solid " + color + ";border-radius:12px;padding:10px 14px;'>" +
          "<div style='font-size:11px;color:var(--text-muted);'>Calificación general</div>" +
          "<div style='font-size:40px;font-weight:800;line-height:1;color:" + color + ";'>" + (score==null ? '—' : score) + "<span style='font-size:16px;'>" + (score==null ? '' : '/100') + "</span></div></div>" +
        "<div style='flex:1;min-width:200px;'><div style='font-size:14px;font-weight:600;'>" + msg + "</div>" +
          "<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px;'>" + comp + "</div></div></div>" +
      "<div style='font-size:12px;font-weight:700;margin:6px 0 4px;'>Parámetros: inicio del periodo vs. última medición</div>" +
      "<table style='width:100%;border-collapse:collapse;font-size:12px;'><thead><tr>" +
        "<th style='text-align:left;padding:6px;border-bottom:2px solid var(--text);'>Parámetro</th>" +
        "<th style='text-align:right;padding:6px;border-bottom:2px solid var(--text);'>Inicio</th>" +
        "<th style='text-align:right;padding:6px;border-bottom:2px solid var(--text);'>Actual</th>" +
        "<th style='text-align:right;padding:6px;border-bottom:2px solid var(--text);'>Cambio</th></tr></thead><tbody>" + rows + "</tbody></table>" +
      "<div style='font-size:12px;font-weight:700;margin:14px 0 4px;'>Evolución combinada (índice: primera medición = 100)</div>" +
      chart + "<div>" + legend + "</div>" + buildCinturaCaderaChart(ms) + buildSeccionesExtra(s, sid, ms, base, fin, del, mes, meses) +
      "<p class='note' style='font-size:10px;margin-top:12px;'>Calificación: 40% composición (% grasa), 30% músculo esquelético y 30% constancia en las mediciones. Verde = avance; rojo = retroceso según el sentido deseable de cada parámetro.</p>" +
      "<div style='display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px;'>" +
        "<span>Coach Iván Pescador · Titanes Yautepec</span><span>Emitido " + fmtLargo(Date.now()) + "</span></div>" +
      "<div style='margin-top:16px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--panel-2);border-radius:0 8px 8px 0;text-align:center;'>" +
        "<div style=\"font-family:'Caveat',cursive;font-size:24px;line-height:1.25;color:var(--text);\">“Para tener cosas que nunca obtuviste, debes hacer cosas que nunca hiciste.”</div>" +
        "<div style=\"font-family:'Caveat',cursive;font-size:19px;color:var(--text-muted);margin-top:4px;\">Con cariño, tu Coach Iván Pescador</div></div>" +
      "<div style='margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--text-muted);line-height:1.5;'>" +
      "<div style='font-weight:700;color:var(--text);letter-spacing:0.5px;'>TITANES · Gimnasio de entrenamiento funcional</div>" +
      "<div>Allende #3, Centro, Yautepec, Morelos · C.P. 62732</div></div>" +
      "<div class='printHide' style='margin-top:12px;text-align:center;'><button class='btn btn-primary' id='pdfBtn' type='button'>📄 Exportar a PDF</button>" +
        "<p class='note' style='margin-top:6px;'>Se abre el diálogo de impresión: elige \"Guardar como PDF\". El archivo se llamará Reporte + primer nombre de la socia.</p></div>" +
    "</div>";
  }

  function buildTapeChart(medidas){
    var keys = [['cuello','Cuello','#8E9AAF'],['pecho','Pecho','#3D7BFF'],['cintura','Cintura','#F0B429'],['cadera','Cadera','#E4573D'],['brazo','Brazo','#5CC8A1'],['muslo','Muslo','#B48CF2'],['pantorrilla','Pantorrilla','#F28CB8']];
    var series = keys.map(function(k){
      var pts = [];
      medidas.forEach(function(m){ if(m[k[0]]) pts.push({t:m.fecha, v:m[k[0]]}); });
      return {label:k[1], color:k[2], pts:pts};
    }).filter(function(x){ return x.pts.length >= 2; });
    if(!series.length) return '';
    var all = [].concat.apply([], series.map(function(x){ return x.pts; }));
    var tMin = Math.min.apply(null, all.map(function(p){return p.t;}));
    var tMax = Math.max.apply(null, all.map(function(p){return p.t;}));
    var vMin = Math.min.apply(null, all.map(function(p){return p.v;}));
    var vMax = Math.max.apply(null, all.map(function(p){return p.v;}));
    var pad = Math.max(2, (vMax - vMin) * 0.1);
    vMin = Math.floor(vMin - pad); vMax = Math.ceil(vMax + pad);
    var W = 340, H = 220, L = 34, R = 10, T = 10, B = 26;
    function X(t){ return L + (tMax === tMin ? (W-L-R)/2 : (t - tMin) / (tMax - tMin) * (W-L-R)); }
    function Y(v){ return T + (vMax - v) / (vMax - vMin) * (H-T-B); }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Evolución de medidas con cinta" style="display:block;">';
    for(var g=0; g<=4; g++){
      var gv = vMin + (vMax - vMin) * g / 4, gy = Y(gv);
      svg += '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (L-4) + '" y="' + (gy+4) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">' + Math.round(gv) + '</text>';
    }
    svg += '<text x="' + L + '" y="' + (H-8) + '" font-size="10" fill="var(--text-muted)">' + fmtDate(tMin) + '</text>' +
      '<text x="' + (W-R) + '" y="' + (H-8) + '" text-anchor="end" font-size="10" fill="var(--text-muted)">' + fmtDate(tMax) + '</text>';
    series.forEach(function(x){
      svg += '<polyline fill="none" stroke="' + x.color + '" stroke-width="2" points="' + x.pts.map(function(p){ return X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '"/>';
      x.pts.forEach(function(p){ svg += '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="3" fill="' + x.color + '"/>'; });
    });
    svg += '</svg>';
    var legend = '<div style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:12px;color:var(--text-muted);">' +
      series.map(function(x){
        var first = x.pts[0].v, last = x.pts[x.pts.length-1].v, d = last - first;
        return '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + x.color + ';margin-right:4px;"></span>' + x.label + ' ' + (d>0?'+':'') + d.toFixed(1) + ' cm</span>';
      }).join('') + '</div>';
    return '<h3 style="margin:16px 0 6px;font-size:16px;">Medidas con cinta (cm)</h3>' + svg + legend;
  }

  function buildTrendChart(medidas, s){
    var n = medidas.length;
    var W = Math.max(520, n*72);
    var H = 190;
    var padTop = 14, padBottom = 26, padX = 12;
    var innerH = H - padTop - padBottom;
    var stepX = n > 1 ? (W - padX*2) / (n-1) : 0;

    var series = [
      {key:'peso', label:'Peso', unit:'kg', color:'#3D7BFF', lowerBetter:null},
      {key:'grasa', label:'% grasa', unit:'%', color:'#E4573D', lowerBetter:true},
      {key:'musculo', label:'Masa musculoesquelética', unit:'kg', color:'#6FCF97', lowerBetter:false},
      {key:'visceral', label:'Gr. visceral', unit:'', color:'#F0B429', lowerBetter:true},
      {key:'masaMuscular', label:'Masa muscular total', unit:'kg', color:'#9B59B6', lowerBetter:false},
      {key:'cintura', label:'Cintura', unit:'cm', color:'#2EC4B6', lowerBetter:true},
      {key:'cadera', label:'Cadera', unit:'cm', color:'#FF8FA3', lowerBetter:null}
    ];

    var svgBody = '';
    var legend = '';

    series.forEach(function(ser){
      var vals = medidas.map(function(med){
        var v = med[ser.key];
        return (v==null || v==='' || isNaN(v)) ? null : Number(v);
      });
      var valid = vals.filter(function(v){ return v != null; });
      if(valid.length < 2) return;

      var min = Math.min.apply(null, valid), max = Math.max.apply(null, valid);
      if(min === max){ min -= 1; max += 1; }

      var path = '', open = false, dots = '';
      vals.forEach(function(v, i){
        var x = padX + i*stepX;
        if(v == null){ open = false; return; }
        var y = padTop + (1 - (v-min)/(max-min)) * innerH;
        path += (open ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
        open = true;
        dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="'+ser.color+'"></circle>';
      });
      svgBody += '<path d="'+path.trim()+'" fill="none" stroke="'+ser.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>' + dots;

      var lowerBetter = ser.lowerBetter;
      if(ser.key === 'peso') lowerBetter = s.objetivo === 'bajar' ? true : (s.objetivo === 'subir' ? false : null);
      var first = valid[0], last = valid[valid.length-1];
      var d = last - first;
      var favorable = lowerBetter == null ? null : (lowerBetter ? d < 0 : d > 0);
      var deltaCls = favorable === true ? 'good' : (favorable === false ? 'bad' : '');
      legend += '<span class="trendLegendItem"><span class="dot" style="background:'+ser.color+';"></span>' +
        ser.label + ' <b>' + (ser.unit ? last.toFixed(1)+ser.unit : last.toFixed(0)) + '</b>' +
        '<span class="trendDelta ' + deltaCls + '">' + (d>0?'+':'') + d.toFixed(1) + (ser.unit||'') + '</span></span>';
    });

    var labels = '';
    var everyN = Math.max(1, Math.ceil(n/6));
    medidas.forEach(function(med, i){
      if(!(n <= 6 || i === 0 || i === n-1 || i % everyN === 0)) return;
      var x = padX + i*stepX;
      labels += '<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" font-size="9.5" fill="#92A196" text-anchor="middle">' + fmtDate(med.fecha) + '</text>';
    });

    if(!svgBody){
      return '<p class="note">Aún faltan valores repetidos de un mismo dato (por ejemplo peso en al menos dos fechas) para trazar la gráfica.</p>';
    }

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" style="display:block;">' + svgBody + labels + '</svg>';
    return '<div class="trendScroll">' + svg + '</div>' +
      '<div class="trendLegend">' + legend + '</div>' +
      '<p class="note">Cada línea usa su propia escala para mostrar la tendencia; compara la forma de la curva en el tiempo, no la posición entre líneas.</p>';
  }

  function deltaSpan(cur, prev, lowerIsBetter){
    if(prev == null || cur == null) return '';
    var d = cur - prev;
    if(Math.abs(d) < 0.05) return '';
    var down = d < 0;
    var cls = (lowerIsBetter ? down : !down) ? 'down' : 'up';
    return '<span class="delta ' + cls + '">' + (d>0?'+':'') + d.toFixed(1) + '</span>';
  }
  function todayStr(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  // ---------- wiring ----------
  document.getElementById('newBtn').addEventListener('click', renderNewForm);
  document.getElementById('searchInput').addEventListener('input', renderRoster);
  document.getElementById('bellBtn').addEventListener('click', function(){
    if(!('Notification' in window)){
      showAlert('Este navegador no soporta avisos del sistema. Aun así, cada vez que abras la app verás arriba a quién le toca medirse.');
      return;
    }
    if(Notification.permission === 'granted'){
      var on = !notifPrefOn();
      setNotifPref(on);
      updateBellState(document.querySelectorAll('.badgeDue').length);
      showAlert(on ? 'Avisos activados en este navegador.' : 'Avisos desactivados en este navegador.');
      return;
    }
    if(Notification.permission === 'denied'){
      showAlert('Los avisos están bloqueados para este sitio en tu navegador. Actívalos desde la configuración del sitio para recibirlos aquí.');
      return;
    }
    Notification.requestPermission().then(function(perm){
      if(perm === 'granted'){ setNotifPref(true); renderRoster(); }
      else { showAlert('No se activaron los avisos. Puedes intentarlo de nuevo cuando quieras.'); }
    });
  });

  initStorage();
  initAssets();
})();
</script>
